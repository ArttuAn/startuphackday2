<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#1a0d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="url(#bg)" rx="16"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#7c3aed" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
  </g>

  <!-- Face circle -->
  <circle cx="90" cy="100" r="62" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  <circle cx="90" cy="100" r="55" fill="#0d0d1a" opacity="0.9"/>

  <!-- Face features — neutral base -->
  <ellipse cx="72" cy="88" rx="8" ry="10" fill="url(#faceGrad)" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="108" cy="88" rx="8" ry="10" fill="url(#faceGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Pupils -->
  <circle cx="72" cy="89" r="4" fill="#0d0d1a"/>
  <circle cx="108" cy="89" r="4" fill="#0d0d1a"/>
  <circle cx="73" cy="88" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="109" cy="88" r="1.5" fill="white" opacity="0.8"/>

  <!-- Smile -->
  <path d="M 72 114 Q 90 128 108 114" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Circuit lines from face -->
  <g stroke="#7c3aed" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M 32 70 L 20 70 L 20 55"/>
    <circle cx="20" cy="53" r="2" fill="#7c3aed"/>
    <path d="M 148 70 L 160 70 L 160 55"/>
    <circle cx="160" cy="53" r="2" fill="#06b6d4"/>
    <path d="M 90 38 L 90 28 L 75 28"/>
    <circle cx="73" cy="28" r="2" fill="#7c3aed"/>
  </g>

  <!-- Scanning line -->
  <rect x="35" y="98" width="110" height="2" fill="url(#accent)" opacity="0.6" rx="1"/>

  <!-- Title text -->
  <text x="185" y="82" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="42" fill="white" letter-spacing="-1">REACT</text>
  <text x="185" y="82" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="42" fill="url(#accent)" letter-spacing="-1" opacity="0.3">REACT</text>

  <!-- AI badge -->
  <rect x="375" y="48" width="42" height="28" rx="6" fill="url(#accent)" opacity="0.9"/>
  <text x="396" y="68" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="16" fill="white" text-anchor="middle">AI</text>

  <!-- Subtitle -->
  <text x="185" y="115" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="15" fill="#94a3b8" letter-spacing="2">STREAMER REACTION MODEL</text>

  <!-- Divider -->
  <rect x="185" y="128" width="340" height="2" fill="url(#accent)" rx="1" opacity="0.6"/>

  <!-- Tag line -->
  <text x="185" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">Teaching AI to feel what gamers feel  •  StartupHack 2025</text>

  <!-- Emotion dots -->
  <g filter="url(#glow)">
    <circle cx="185" cy="172" r="4" fill="#7c3aed"/>
    <circle cx="200" cy="172" r="4" fill="#8b5cf6"/>
    <circle cx="215" cy="172" r="4" fill="#06b6d4"/>
    <circle cx="230" cy="172" r="4" fill="#0ea5e9"/>
    <circle cx="245" cy="172" r="4" fill="#10b981"/>
    <circle cx="260" cy="172" r="4" fill="#f59e0b"/>
    <circle cx="275" cy="172" r="4" fill="#ef4444"/>
    <circle cx="290" cy="172" r="4" fill="#ec4899"/>
    <circle cx="305" cy="172" r="4" fill="#a78bfa"/>
    <circle cx="320" cy="172" r="4" fill="#67e8f9"/>
  </g>
  <text x="338" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#475569">10 emotion classes</text>
</svg>
